[project]
name = "bdh-cq"
version = "0.0.17"
description = "Implementation of BDH-CQ: In-Context Learning with Recurrent Latent Reasoning, proposed by Pathway Research"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'in-context learning',
    'recurrent latent reasoning'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.4.0",
    "einops>=0.8.1",
    "numpy",
    "rotary-embedding-torch",
    "torch>=2.5",
]

[project.urls]
Homepage = "https://pypi.org/project/bdh-cq/"
Repository = "https://github.com/lucidrains/bdh-cq"

[project.optional-dependencies]
examples = [
    "datasets",
    "tqdm"
]
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "fire>=0.7.1",
    "tqdm>=4.70.0",
]

[tool.hatch.build]
include = [
    "bdh_cq",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["bdh_cq"]
